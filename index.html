<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Git &amp; GitHub na Prática</title>
<style>
:root{
  --bg:#f7f7f5;--panel:#fff;--panel2:#f0efeb;--text:#1f2328;--muted:#656d76;--line:#e3e1db;
  --accent:#e8590c;--accent2:#f76707;--accent-soft:#fff0e6;--green:#2f9e44;--red:#e03131;--blue:#1c7ed6;--yellow:#f59f00;
  --code-bg:#14161a;--code-text:#e6e6e6;--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
}
:root[data-theme=dark]{
  --bg:#0f1115;--panel:#171a20;--panel2:#1e222a;--text:#e6e8eb;--muted:#9aa4b2;--line:#2a2f39;
  --accent:#ff922b;--accent2:#ffa94d;--accent-soft:#2b2015;--green:#51cf66;--red:#ff6b6b;--blue:#4dabf7;--yellow:#ffd43b;
  --code-bg:#0b0d10;--code-text:#e6e6e6;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#0f1115;--panel:#171a20;--panel2:#1e222a;--text:#e6e8eb;--muted:#9aa4b2;--line:#2a2f39;
    --accent:#ff922b;--accent2:#ffa94d;--accent-soft:#2b2015;--green:#51cf66;--red:#ff6b6b;--blue:#4dabf7;--yellow:#ffd43b;
    --code-bg:#0b0d10;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
code,pre,.mono{font-family:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace}
:not(pre)>code{background:var(--panel2);border:1px solid var(--line);padding:.08em .4em;border-radius:6px;font-size:.88em}

/* layout */
.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px 40px}
main{min-width:0;padding:0 clamp(16px,4vw,48px) 80px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;letter-spacing:-.02em;margin:2px 6px 14px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#c92a2a);display:grid;place-items:center;color:#fff;font-size:18px}
.prog{margin:0 6px 14px}
.prog .bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--yellow));transition:width .4s}
.prog small{color:var(--muted)}
.search{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;margin-bottom:10px}
.search:focus{outline:2px solid var(--accent);outline-offset:1px}
details.mod{margin:4px 0}
details.mod>summary{list-style:none;cursor:pointer;padding:8px 10px;border-radius:10px;font-weight:700;font-size:.9rem;display:flex;gap:8px;align-items:center;user-select:none}
details.mod>summary::-webkit-details-marker{display:none}
details.mod>summary:hover{background:var(--panel2)}
details.mod>summary .n{width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-size:.75rem;display:grid;place-items:center;flex:none}
details.mod>summary .c{margin-left:auto;font-weight:500;font-size:.75rem;color:var(--muted)}
.nav a{display:flex;gap:9px;align-items:center;padding:6px 10px 6px 18px;margin-left:10px;border-left:2px solid var(--line);text-decoration:none;color:var(--muted);font-size:.9rem;line-height:1.35}
.nav a:hover{color:var(--text);background:var(--panel2)}
.nav a.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);font-weight:600}
.nav a .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:9px;color:#fff}
.nav a.done .dot{background:var(--green);border-color:var(--green)}
.nav a.done .dot::after{content:"✓"}
.special{display:flex;flex-direction:column;gap:2px;margin:10px 0}
.special a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--text);font-weight:600;font-size:.9rem}
.special a:hover,.special a.active{background:var(--accent-soft);color:var(--accent)}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 calc(-1*clamp(16px,4vw,48px));padding-inline:clamp(16px,4vw,48px)}
.topbar .crumb{color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:38px;height:38px;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--accent)}
#menuBtn{display:none}
.readbar{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;z-index:50}

article{max-width:820px;margin:0 auto;padding-top:34px}
.kicker{color:var(--accent);font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:clamp(1.9rem,4vw,2.6rem);line-height:1.15;letter-spacing:-.03em;margin:.3em 0 .2em}
h2{font-size:1.5rem;letter-spacing:-.02em;margin:2em 0 .4em;padding-top:.3em}
h3{font-size:1.15rem;margin:1.6em 0 .3em}
.meta{color:var(--muted);font-size:.9rem;display:flex;gap:14px;flex-wrap:wrap;margin-bottom:1.4em}
p,li{max-width:70ch}
li{margin:.25em 0}
.lead{font-size:1.15rem;color:var(--muted)}

.call{border-radius:14px;padding:14px 18px;margin:1.2em 0;border:1px solid var(--line);border-left-width:5px;background:var(--panel);box-shadow:var(--shadow)}
.call b.t{display:block;margin-bottom:2px;font-size:.85rem;letter-spacing:.04em;text-transform:uppercase}
.call.tip{border-left-color:var(--green)} .call.tip b.t{color:var(--green)}
.call.warn{border-left-color:var(--yellow)} .call.warn b.t{color:var(--yellow)}
.call.info{border-left-color:var(--blue)} .call.info b.t{color:var(--blue)}
.call.danger{border-left-color:var(--red)} .call.danger b.t{color:var(--red)}
.call p{margin:.3em 0}

.codeblock{position:relative;margin:1.1em 0;border-radius:14px;overflow:hidden;background:var(--code-bg);box-shadow:var(--shadow);border:1px solid #262b33}
.codeblock .bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#1b1f26;color:#8b95a5;font-size:.75rem}
.codeblock .bar i{width:10px;height:10px;border-radius:50%;background:#ff5f56}
.codeblock .bar i:nth-child(2){background:#ffbd2e}.codeblock .bar i:nth-child(3){background:#27c93f}
.codeblock .bar span{margin-left:8px}
.codeblock .bar button{margin-left:auto;background:#262b33;color:#cbd5e1;border:0;border-radius:7px;padding:3px 10px;font-size:.72rem}
.codeblock .bar button:hover{background:var(--accent);color:#fff}
.codeblock pre{margin:0;padding:14px 18px;overflow:auto;color:var(--code-text);font-size:.88rem;line-height:1.65}
.codeblock .p{color:#51cf66;user-select:none}
.codeblock .cmd{color:#ffa94d;font-weight:700}
.codeblock .sub{color:#74c0fc;font-weight:600}
.codeblock .fl{color:#da77f2}
.codeblock .cm{color:#7d8794;font-style:italic}
.codeblock .out{color:#aab3c0}
.codeblock .str{color:#8ce99a}

table{border-collapse:collapse;width:100%;margin:1.2em 0;background:var(--panel);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);font-size:.93rem}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--panel2);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
tr:last-child td{border-bottom:0}
.tablewrap{overflow:auto}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);margin:1.2em 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:1.2em 0}
.grid .card{margin:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 16px;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* quiz */
.quiz{margin:2.2em 0 1em}
.q{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:12px 0;box-shadow:var(--shadow)}
.q h4{margin:0 0 10px;font-size:1rem}
.q .opt{display:block;width:100%;text-align:left;padding:10px 14px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.q .opt:hover:not(:disabled){border-color:var(--accent)}
.q .opt.ok{background:color-mix(in srgb,var(--green) 18%,var(--panel));border-color:var(--green)}
.q .opt.bad{background:color-mix(in srgb,var(--red) 16%,var(--panel));border-color:var(--red)}
.q .exp{margin-top:8px;padding:10px 14px;border-radius:10px;background:var(--panel2);font-size:.92rem;display:none}
.q.answered .exp{display:block}

/* nav footer */
.pager{display:flex;gap:12px;justify-content:space-between;margin-top:3em;flex-wrap:wrap}
.pager a{flex:1;min-width:200px;text-decoration:none;color:var(--text);border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
.pager a:hover{border-color:var(--accent)}
.pager small{color:var(--muted);display:block}
.pager a.next{text-align:right}
.finish{display:flex;justify-content:center;margin:2em 0 0}

/* widgets */
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.area{border:2px dashed var(--line);border-radius:14px;padding:12px;min-height:140px;background:var(--panel)}
.area h5{margin:0 0 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.area .file{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:9px;font-size:.85rem;margin:3px;background:var(--panel2);border:1px solid var(--line);animation:pop .3s}
.area .file.mod{background:color-mix(in srgb,var(--yellow) 22%,var(--panel));border-color:var(--yellow)}
.area .file.stg{background:color-mix(in srgb,var(--green) 20%,var(--panel));border-color:var(--green)}
.area .file.com{background:color-mix(in srgb,var(--blue) 18%,var(--panel));border-color:var(--blue)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.wbtns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.wlog{font-size:.88rem;color:var(--muted);min-height:1.6em}

/* lab */
.lab{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;margin-top:16px}
.term{background:var(--code-bg);border-radius:14px;overflow:hidden;border:1px solid #262b33;display:flex;flex-direction:column;height:520px;box-shadow:var(--shadow)}
.term .bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#1b1f26;color:#8b95a5;font-size:.75rem}
.term .bar i{width:10px;height:10px;border-radius:50%;background:#ff5f56}.term .bar i:nth-child(2){background:#ffbd2e}.term .bar i:nth-child(3){background:#27c93f}
.term .bar span{margin-left:8px}
#tout{flex:1;overflow:auto;padding:12px 14px;color:#d7dde5;font-size:.85rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}
#tout .l{color:#ffa94d;font-weight:700} #tout .g{color:#51cf66} #tout .r{color:#ff6b6b} #tout .y{color:#ffd43b} #tout .d{color:#7d8794} #tout .b{color:#74c0fc}
.tin{display:flex;gap:8px;padding:10px 14px;border-top:1px solid #262b33;align-items:center}
.tin span{color:#51cf66;font-size:.85rem;white-space:nowrap}
.tin input{flex:1;background:transparent;border:0;outline:0;color:#fff;font:inherit;font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 11px;font-size:.78rem;font-family:ui-monospace,Consolas,monospace}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.side{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.panel h4{margin:0 0 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
#graph{overflow:auto}
#graph svg{display:block;min-width:100%}
.goal{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;padding:3px 0}
.goal i{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:3px;display:grid;place-items:center;font-size:10px;color:#fff;font-style:normal}
.goal.ok i{background:var(--green);border-color:var(--green)}
.goal.ok span{text-decoration:line-through;color:var(--muted)}
.fstate{display:flex;flex-wrap:wrap;gap:6px}
.fstate span{font-size:.8rem;padding:3px 9px;border-radius:8px;border:1px solid var(--line);font-family:ui-monospace,Consolas,monospace}
.fs-u{background:color-mix(in srgb,var(--red) 15%,var(--panel))}
.fs-m{background:color-mix(in srgb,var(--yellow) 22%,var(--panel))}
.fs-s{background:color-mix(in srgb,var(--green) 20%,var(--panel))}
.fs-c{background:color-mix(in srgb,var(--blue) 15%,var(--panel))}

/* cheat sheet */
.cs-row{display:grid;grid-template-columns:minmax(200px,auto) 1fr;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.cs-row:last-child{border:0}
.cs-row code{cursor:pointer;background:var(--code-bg);color:#ffa94d;border:0;padding:5px 10px;border-radius:8px;display:inline-block;font-size:.85rem}
.cs-row code:hover{outline:2px solid var(--accent)}
.cs-cat{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;margin:22px 0 6px}

/* hero */
.hero{padding:40px 0 10px}
.hero h1{font-size:clamp(2.2rem,5.5vw,3.6rem)}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),#c92a2a);-webkit-background-clip:text;background-clip:text;color:transparent}
.modcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:1.5em 0}
.modcard{display:block;text-decoration:none;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);transition:.15s}
.modcard:hover{transform:translateY(-3px);border-color:var(--accent)}
.modcard .n{font-size:.75rem;color:var(--accent);font-weight:700}
.modcard h3{margin:.2em 0 .3em;font-size:1.05rem}
.modcard p{margin:0;color:var(--muted);font-size:.88rem}
.modcard .mp{height:5px;border-radius:9px;background:var(--panel2);margin-top:12px;overflow:hidden}
.modcard .mp i{display:block;height:100%;background:var(--green)}
.score{font-size:3rem;font-weight:800;letter-spacing:-.04em}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:99px;opacity:0;transition:.25s;z-index:99;font-size:.9rem;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:980px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;z-index:60;left:0;top:0;width:min(330px,88vw);transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow)}
  body.menu aside{transform:none}
  #menuBtn{display:grid}
  .lab{grid-template-columns:1fr}
  .areas{grid-template-columns:1fr}
  .cs-row{grid-template-columns:1fr}
}
@media print{aside,.topbar,.pager,.quiz{display:none}.app{display:block}}
</style>
</head>
<body>
<div class="readbar" id="readbar"></div>
<div class="app">
  <aside id="side">
    <div class="brand"><div class="logo">⑂</div><div>Git &amp; GitHub<br><small style="font-weight:500;color:var(--muted)">na prática</small></div></div>
    <div class="prog"><div class="bar"><i id="pbar"></i></div><small id="ptxt"></small></div>
    <input class="search" id="search" placeholder="Buscar lição…  ( / )" autocomplete="off">
    <div class="special" id="special"></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main>
    <div class="topbar">
      <button class="iconbtn" id="menuBtn" title="Menu">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="sp"></div>
      <button class="iconbtn" id="themeBtn" title="Alternar tema">◐</button>
    </div>
    <article id="view"></article>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)}

/* bloco de código com realce simples: linhas "$ cmd" são comandos, as demais são saída */
function C(text,title){
  text=text.replace(/^\n/,'').replace(/\n\s*$/,'');
  const raw=text.split('\n').filter(l=>l.startsWith('$ ')).map(l=>l.slice(2)).join('\n')||text;
  const html=text.split('\n').map(l=>{
    if(l.startsWith('$ ')){
      let body=l.slice(2),cm='';const i=body.search(/\s#\s/);if(i>-1){cm=body.slice(i);body=body.slice(0,i)}
      let b=esc(body).replace(/("[^"]*"|'[^']*')/g,'<span class="str">$1</span>')
        .replace(/(^|\s)(--?[a-zA-Z][\w-]*)/g,'$1<span class="fl">$2</span>');
      b=b.replace(/^(\S+)(\s+)(\S+)/,(m,a,s,c)=>'<span class="cmd">'+a+'</span>'+s+(c.startsWith('-')||c.startsWith('<span')?c:'<span class="sub">'+c+'</span>'));
      return '<span class="p">$</span> '+b+(cm?'<span class="cm">'+esc(cm)+'</span>':'');
    }
    if(l.startsWith('# '))return '<span class="cm">'+esc(l)+'</span>';
    return '<span class="out">'+esc(l)+'</span>';
  }).join('\n');
  return '<div class="codeblock"><div class="bar"><i></i><i></i><i></i><span>'+esc(title||'terminal')+'</span><button data-copy="'+esc(raw).replace(/"/g,'&quot;')+'">copiar</button></div><pre>'+html+'</pre></div>';
}
const call=(type,title,html)=>'<div class="call '+type+'"><b class="t">'+title+'</b>'+html+'</div>';
const tip=(h,t='Dica')=>call('tip',t,h), warn=(h,t='Atenção')=>call('warn',t,h), info=(h,t='Bom saber')=>call('info',t,h), danger=(h,t='Perigo')=>call('danger',t,h);

/* ============ CONTEÚDO ============ */
const MODULES=[
/* ---------------- 1 ---------------- */
{id:'m1',title:'Fundamentos',desc:'O que são Git e GitHub, e como instalar tudo.',lessons:[
{id:'o-que-e',title:'O que é Git (e o que não é)',min:6,body:()=>`
<p class="lead">Git é um sistema de controle de versão distribuído: ele registra a história do seu projeto e deixa você voltar no tempo, trabalhar em paralelo e colaborar sem pisar nos pés de ninguém.</p>
<h2>O problema que o Git resolve</h2>
<p>Quem nunca teve uma pasta assim?</p>
${C(`
relatorio_final.docx
relatorio_final_v2.docx
relatorio_final_v2_REVISADO.docx
relatorio_final_v2_REVISADO_agora_vai.docx`,'a vida sem controle de versão')}
<p>Com Git, existe <b>um</b> arquivo e uma linha do tempo de <b>commits</b>: fotografias do projeto, cada uma com autor, data e mensagem explicando o motivo da mudança.</p>
<h2>Git ≠ GitHub</h2>
<div class="grid">
<div class="card"><h3 style="margin-top:0">🧰 Git</h3><p>Programa que roda na <b>sua máquina</b>. Gratuito, de código aberto, criado por Linus Torvalds em 2005 para o kernel do Linux. Funciona 100% offline.</p></div>
<div class="card"><h3 style="margin-top:0">☁️ GitHub</h3><p>Serviço na <b>nuvem</b> que hospeda repositórios Git e adiciona colaboração: Pull Requests, Issues, Actions, Pages. Alternativas: GitLab, Bitbucket.</p></div>
</div>
<h2>Conceitos-chave</h2>
<table><tr><th>Termo</th><th>Significado</th></tr>
<tr><td><b>Repositório</b></td><td>Pasta do projeto + a pasta oculta <code>.git</code> com todo o histórico.</td></tr>
<tr><td><b>Commit</b></td><td>Um snapshot do projeto, identificado por um hash (ex.: <code>a3f9c2e</code>).</td></tr>
<tr><td><b>Branch</b></td><td>Uma linha de desenvolvimento independente; na prática, um ponteiro para um commit.</td></tr>
<tr><td><b>Remote</b></td><td>Cópia do repositório hospedada em outro lugar (ex.: GitHub).</td></tr>
<tr><td><b>Merge</b></td><td>Juntar o trabalho de duas branches.</td></tr>
</table>
${info('<p>"Distribuído" significa que <b>cada pessoa tem o histórico completo</b> na própria máquina. Se o servidor sumir, qualquer clone é um backup completo.</p>')}
`,quiz:[
{q:'Qual a diferença entre Git e GitHub?',o:['São o mesmo programa com nomes diferentes','Git é a ferramenta de versionamento local; GitHub é um serviço online que hospeda repositórios Git','Git é pago e GitHub é gratuito','GitHub é a versão offline do Git'],a:1,e:'Git roda localmente e gerencia o histórico. GitHub hospeda repositórios Git e adiciona recursos de colaboração.'},
{q:'O que significa Git ser "distribuído"?',o:['Só funciona com internet','Cada clone possui o histórico completo do projeto','Os arquivos ficam divididos em vários servidores','Só pode ter um desenvolvedor por vez'],a:1,e:'Todo clone contém o histórico inteiro, por isso é possível trabalhar offline e qualquer cópia serve de backup.'}]},

{id:'instalacao',title:'Instalação e configuração inicial',min:7,body:()=>`
<h2>Instalando o Git</h2>
<table><tr><th>Sistema</th><th>Como instalar</th></tr>
<tr><td><b>Windows</b></td><td>Baixe em <a href="https://git-scm.com/downloads" target="_blank" rel="noopener">git-scm.com</a> (inclui o <i>Git Bash</i>) ou use <code>winget install Git.Git</code>.</td></tr>
<tr><td><b>macOS</b></td><td><code>brew install git</code> ou rode <code>git --version</code> e aceite instalar as Xcode Command Line Tools.</td></tr>
<tr><td><b>Linux</b></td><td><code>sudo apt install git</code> (Debian/Ubuntu) · <code>sudo dnf install git</code> (Fedora)</td></tr></table>
${C(`
$ git --version
git version 2.47.0`)}
<h2>Apresente-se ao Git</h2>
<p>Todo commit leva nome e e-mail. Configure uma vez, globalmente:</p>
${C(`
$ git config --global user.name "Seu Nome"
$ git config --global user.email "voce@exemplo.com"
$ git config --global init.defaultBranch main
$ git config --global core.editor "code --wait"   # VS Code como editor
$ git config --global pull.rebase false`)}
${tip('<p>Use no Git o <b>mesmo e-mail da sua conta do GitHub</b> (ou o e-mail <code>noreply</code> que o GitHub oferece nas configurações). Assim seus commits aparecem no seu perfil.</p>')}
<h2>Os três níveis de configuração</h2>
<table><tr><th>Flag</th><th>Escopo</th><th>Arquivo</th></tr>
<tr><td><code>--system</code></td><td>Todos os usuários da máquina</td><td><code>/etc/gitconfig</code></td></tr>
<tr><td><code>--global</code></td><td>Seu usuário</td><td><code>~/.gitconfig</code></td></tr>
<tr><td><code>--local</code></td><td>Somente o repositório atual</td><td><code>.git/config</code></td></tr></table>
${C(`
$ git config --list --show-origin
$ git config user.name`)}
<h2>Aliases: atalhos para o que você mais usa</h2>
${C(`
$ git config --global alias.st "status -sb"
$ git config --global alias.lg "log --oneline --graph --decorate --all"
$ git config --global alias.co "checkout"`)}
<p>Depois disso, <code>git lg</code> mostra a árvore de commits de forma compacta.</p>
`,quiz:[
{q:'Qual comando define seu nome para todos os repositórios da máquina?',o:['git config user.name "Nome"','git config --global user.name "Nome"','git set name "Nome"','git init --name "Nome"'],a:1,e:'A flag --global grava em ~/.gitconfig e vale para todos os seus repositórios.'},
{q:'Onde fica a configuração "local" de um repositório?',o:['~/.gitconfig','/etc/gitconfig','.git/config','package.json'],a:2,e:'--local escreve em .git/config, dentro do repositório.'}]},

{id:'github-conta',title:'Criando sua conta e conectando via SSH',min:8,body:()=>`
<h2>Conta no GitHub</h2>
<ol><li>Acesse <a href="https://github.com/signup" target="_blank" rel="noopener">github.com/signup</a> e crie a conta.</li>
<li>Ative a <b>autenticação em dois fatores (2FA)</b> em <i>Settings → Password and authentication</i>.</li>
<li>Complete seu perfil (foto, bio) — ele é seu portfólio.</li></ol>
<h2>Como o Git se autentica no GitHub</h2>
<p>Para enviar código (<code>push</code>) o GitHub precisa saber quem você é. Há duas formas comuns — o GitHub <b>não aceita mais senha</b> pela linha de comando:</p>
<div class="grid">
<div class="card"><h3 style="margin-top:0">🔑 SSH (recomendado)</h3><p>Um par de chaves: a privada fica com você, a pública vai para o GitHub. Sem digitar nada depois de configurar.</p></div>
<div class="card"><h3 style="margin-top:0">🌐 HTTPS + token</h3><p>URL <code>https://…</code> e um <i>Personal Access Token</i> no lugar da senha. O <b>Git Credential Manager</b> (já incluso no Windows) cuida disso para você.</p></div>
</div>
<h2>Configurando SSH passo a passo</h2>
${C(`
$ ssh-keygen -t ed25519 -C "voce@exemplo.com"
Enter file in which to save the key (~/.ssh/id_ed25519): [Enter]
Enter passphrase (empty for no passphrase): [crie uma senha]

$ eval "$(ssh-agent -s)"
$ ssh-add ~/.ssh/id_ed25519

$ cat ~/.ssh/id_ed25519.pub
ssh-ed25519 AAAAC3Nza... voce@exemplo.com`)}
<ol><li>Copie <b>toda</b> a saída do último comando (é a chave <i>pública</i>).</li>
<li>No GitHub: <i>Settings → SSH and GPG keys → New SSH key</i> e cole.</li>
<li>Teste:</li></ol>
${C(`
$ ssh -T git@github.com
Hi seu-usuario! You've successfully authenticated, but GitHub does not provide shell access.`)}
${danger('<p><b>Nunca</b> compartilhe a chave privada (<code>id_ed25519</code>, sem <code>.pub</code>) nem cole tokens em commits. Se vazar, revogue imediatamente.</p>')}
`,quiz:[
{q:'Qual arquivo você cola no GitHub ao configurar SSH?',o:['id_ed25519 (chave privada)','id_ed25519.pub (chave pública)','.gitconfig','known_hosts'],a:1,e:'Somente a chave pública (.pub) vai para o GitHub. A privada nunca sai da sua máquina.'}]}
]},

{id:'m2',title:'Seu primeiro repositório',desc:'init, add, commit e os três estados dos arquivos.',lessons:[
{id:'init-commit',title:'init, status, add e commit',min:10,body:()=>`
<h2>Criando um repositório</h2>
${C(`
$ mkdir meu-projeto
$ cd meu-projeto
$ git init
Initialized empty Git repository in .../meu-projeto/.git/`)}
<p>Pronto: agora existe uma pasta oculta <code>.git</code>. Apagá-la apaga o histórico — mas o projeto continua lá.</p>
<h2>O ciclo básico</h2>
${C(`
$ echo "# Meu Projeto" > README.md
$ git status
On branch main
Untracked files:
	README.md

$ git add README.md
$ git commit -m "docs: adiciona README inicial"
[main (root-commit) 4f1c2a9] docs: adiciona README inicial
 1 file changed, 1 insertion(+)`)}
<h2>Os três estados (e as três áreas)</h2>
<p>Esta é a ideia mais importante do Git. Brinque com o widget abaixo:</p>
<div class="card" data-widget="areas"></div>
<table><tr><th>Área</th><th>O que é</th></tr>
<tr><td><b>Working Directory</b></td><td>Os arquivos como estão na sua pasta agora.</td></tr>
<tr><td><b>Staging Area (index)</b></td><td>A "caixa de envio": o que vai entrar no próximo commit.</td></tr>
<tr><td><b>Repository</b></td><td>O histórico de commits em <code>.git</code>.</td></tr></table>
${tip('<p>Staging existe para você montar commits <b>coesos</b>. Alterou cinco arquivos mas são duas ideias diferentes? Faça <code>git add</code> só dos arquivos de cada ideia e dois commits separados.</p>')}
<h2>Atalhos úteis</h2>
${C(`
$ git add .              # adiciona tudo (novos + modificados) da pasta atual
$ git add -p             # escolhe trechos (hunks) interativamente
$ git commit -am "msg"   # add dos arquivos JÁ rastreados + commit
$ git status -sb         # versão curta e compacta`)}
<div class="call info"><b class="t">Pratique agora</b><p>Abra o <a href="#/lab">Laboratório</a> e execute: <code>git init</code>, <code>touch a.txt</code>, <code>git add .</code>, <code>git commit -m "primeiro"</code>.</p></div>
`,quiz:[
{q:'O que faz "git add arquivo.txt"?',o:['Cria o commit','Move o arquivo para a staging area','Envia para o GitHub','Cria o arquivo vazio'],a:1,e:'git add coloca a versão atual do arquivo na staging area, preparando-o para o próximo commit.'},
{q:'Você alterou um arquivo que já estava rastreado. Qual atalho faz add + commit juntos?',o:['git commit -m "msg" --all-files','git commit -am "msg"','git add commit "msg"','git push -a'],a:1,e:'-a inclui automaticamente os arquivos rastreados modificados (não inclui arquivos novos/untracked).'},
{q:'Em qual área ficam os arquivos que serão incluídos no PRÓXIMO commit?',o:['Working Directory','Staging Area','Remote','Stash'],a:1,e:'A staging area (index) guarda o snapshot que será confirmado no próximo commit.'}]},

{id:'boas-mensagens',title:'Mensagens de commit que contam uma história',min:6,body:()=>`
<p class="lead">Daqui a seis meses, <code>git log</code> será a documentação do <i>porquê</i> o código é como é. Escreva pensando nessa pessoa — provavelmente você.</p>
<h2>Anatomia de uma boa mensagem</h2>
${C(`
feat(auth): permite login com conta Google

Adiciona o fluxo OAuth2 usando a biblioteca oficial. O login por
e-mail continua funcionando. Sessões agora expiram em 7 dias.

Closes #42`,'mensagem de commit')}
<ul><li><b>Linha de título</b>: até ~50 caracteres, no imperativo ("adiciona", "corrige"), sem ponto final.</li>
<li><b>Linha em branco</b>, depois o <b>corpo</b> explicando <i>o quê e por quê</i> (o "como" o código já mostra).</li>
<li><b>Rodapé</b>: referências a issues (<code>Closes #42</code>).</li></ul>
<h2>Conventional Commits</h2>
<p>Um padrão popular que facilita changelogs e versionamento automático:</p>
<table><tr><th>Tipo</th><th>Uso</th></tr>
<tr><td><code>feat</code></td><td>Nova funcionalidade</td></tr><tr><td><code>fix</code></td><td>Correção de bug</td></tr>
<tr><td><code>docs</code></td><td>Somente documentação</td></tr><tr><td><code>refactor</code></td><td>Mudança interna sem alterar comportamento</td></tr>
<tr><td><code>test</code></td><td>Testes</td></tr><tr><td><code>chore</code></td><td>Build, dependências, tarefas de manutenção</td></tr>
<tr><td><code>style</code></td><td>Formatação, sem mudar lógica</td></tr></table>
<div class="grid"><div class="card"><b style="color:var(--red)">✗ Ruim</b><br><code>fix</code> · <code>mudanças</code> · <code>asdf</code> · <code>agora vai</code></div>
<div class="card"><b style="color:var(--green)">✓ Bom</b><br><code>fix(cart): evita total negativo com cupom expirado</code></div></div>
${tip('<p><b>Commits pequenos e frequentes</b> > um commitzão gigante. Cada commit deve ser uma mudança lógica que compila e (idealmente) passa nos testes.</p>')}
`,quiz:[
{q:'Qual mensagem segue melhor as boas práticas?',o:['mudei umas coisas','fix: corrige cálculo de frete para CEPs do Norte','Arrumando bug!!!','update'],a:1,e:'É curta, no imperativo, tem tipo e diz exatamente o que foi corrigido.'}]},

{id:'gitignore',title:'.gitignore: o que NÃO versionar',min:5,body:()=>`
<p>Nem tudo pertence ao repositório: dependências, builds, logs, segredos. O arquivo <code>.gitignore</code> diz ao Git o que ignorar.</p>
${C(`
# dependências
node_modules/
venv/

# build
dist/
build/
*.class

# segredos e ambiente
.env
*.pem

# sistema/editor
.DS_Store
Thumbs.db
.vscode/
*.log

# exceção: mantenha este arquivo
!.env.example`,'.gitignore')}
<h2>Regras de padrão</h2>
<table><tr><th>Padrão</th><th>Efeito</th></tr>
<tr><td><code>*.log</code></td><td>Qualquer arquivo terminando em .log</td></tr>
<tr><td><code>pasta/</code></td><td>A pasta e tudo dentro dela</td></tr>
<tr><td><code>/arquivo</code></td><td>Somente na raiz do repositório</td></tr>
<tr><td><code>**/temp</code></td><td>Qualquer pasta "temp" em qualquer nível</td></tr>
<tr><td><code>!importante.log</code></td><td>Exceção: NÃO ignore este</td></tr></table>
${warn('<p>O <code>.gitignore</code> só afeta arquivos <b>ainda não rastreados</b>. Se já fez commit de um arquivo, é preciso removê-lo do índice:</p>'+C(`
$ git rm --cached .env
$ git commit -m "chore: para de versionar .env"`))}
${danger('<p>Se você commitou uma senha ou token, <b>trate-o como vazado</b>: revogue/troque a credencial. Apagar do histórico não basta, pois cópias podem existir.</p>')}
${tip('<p>Gere um <code>.gitignore</code> pronto para sua linguagem em <a href="https://gitignore.io" target="_blank" rel="noopener">gitignore.io</a> ou nos templates do próprio GitHub ao criar um repositório.</p>')}
`,quiz:[
{q:'Você adicionou .env ao .gitignore, mas ele já havia sido commitado. O que fazer?',o:['Nada, o Git passa a ignorar automaticamente','git rm --cached .env e novo commit','Apagar a pasta .git','git ignore .env'],a:1,e:'O .gitignore não afeta arquivos já rastreados. Use git rm --cached para parar de rastrear (mantendo o arquivo local). E troque as credenciais expostas!'}]}
]},
